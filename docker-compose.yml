
services:

  # ==========================================
  # API ORIGINAL DE SIGERU
  # ==========================================
  api:
    build:
      context: .

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      JWT_SECRET: "${JWT_SECRET:-sigeru-docker-local-jwt-secret-change-this-in-production-2026}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proyecto_sigeru
      DB_USERNAME: sigeru
      DB_PASSWORD: sigeru

    ports:
      - "8000:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/api/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ==========================================
  # API DE USUARIOS
  # ==========================================
  api-usuarios:
    build:
      context: ./api-usuarios

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      APP_KEY: "${USUARIOS_APP_KEY:?Definir USUARIOS_APP_KEY}"
      JWT_SECRET: "${USUARIOS_JWT_SECRET:?Definir USUARIOS_JWT_SECRET}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proyecto_sigeru
      DB_USERNAME: "${SIGERU_DB_USERNAME:?Definir SIGERU_DB_USERNAME}"
      DB_PASSWORD: "${SIGERU_DB_PASSWORD:?Definir SIGERU_DB_PASSWORD}"

    ports:
      - "8001:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/api/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ==========================================
  # API DE GESTION
  # ==========================================
  api-gestion:
    build:
      context: ./api-gestion

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8002
      APP_KEY: "${GESTION_APP_KEY:?Definir GESTION_APP_KEY}"
      JWT_SECRET: "${USUARIOS_JWT_SECRET:?Definir USUARIOS_JWT_SECRET}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proyecto_sigeru
      DB_USERNAME: "${SIGERU_DB_USERNAME:?Definir SIGERU_DB_USERNAME}"
      DB_PASSWORD: "${SIGERU_DB_PASSWORD:?Definir SIGERU_DB_PASSWORD}"

    ports:
      - "8002:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/api/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ==========================================
  # API DE RECOLECCION
  # ==========================================
  api-recoleccion:
    build:
      context: ./api-recoleccion

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8003
      APP_KEY: "${RECOLECCION_APP_KEY:?Definir RECOLECCION_APP_KEY}"
      JWT_SECRET: "${USUARIOS_JWT_SECRET:?Definir USUARIOS_JWT_SECRET}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proyecto_sigeru
      DB_USERNAME: "${SIGERU_DB_USERNAME:?Definir SIGERU_DB_USERNAME}"
      DB_PASSWORD: "${SIGERU_DB_PASSWORD:?Definir SIGERU_DB_PASSWORD}"

    ports:
      - "8003:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/api/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  # ==========================================
  # FRONTEND DE SIGERU
  # ==========================================
  ui:
    build:
      context: ../Frontend_SIGERU

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "5173:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # ==========================================
  # BASE DE DATOS MYSQL
  # ==========================================
  mysql:
    image: mysql:8.4

    command: --lower-case-table-names=1

    environment:
      MYSQL_DATABASE: proyecto_sigeru
      MYSQL_USER: sigeru
      MYSQL_PASSWORD: sigeru
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql
      - ./proyecto_sigeru.sql:/docker-entrypoint-initdb.d/01-proyecto_sigeru.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


# ==========================================
# VOLUMEN PERSISTENTE DE MYSQL
# ==========================================
volumes:
  mysql_data:
