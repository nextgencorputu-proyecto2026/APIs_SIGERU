services:

  api:
    build:
      context: .

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      JWT_SECRET: "${JWT_SECRET:-sigeru-docker-local-jwt-secret-change-this-in-production-2026}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proyecto_sigeru
      DB_USERNAME: sigeru
      DB_PASSWORD: sigeru

    ports:
      - "8000:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/api/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  ui:
    build:
      context: ../Frontend_SIGERU

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "5173:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  mysql:
    image: mysql:8.4

    # El esquema legado usa nombres de tabla en mayúsculas, mientras Laravel
    # los consulta en minúsculas. Mantiene el mismo comportamiento en Windows
    # y en el contenedor Linux.
    command: --lower-case-table-names=1

    environment:
      MYSQL_DATABASE: proyecto_sigeru
      MYSQL_USER: sigeru
      MYSQL_PASSWORD: sigeru
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql
      - ./proyecto_sigeru.sql:/docker-entrypoint-initdb.d/01-proyecto_sigeru.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


volumes:
  mysql_data:
